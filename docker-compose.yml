version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resqmesh-postgres
    environment:
      POSTGRES_DB: resqmesh_db
      POSTGRES_USER: resqmesh_user
      POSTGRES_PASSWORD: resqmesh_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqmesh_user -d resqmesh_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
