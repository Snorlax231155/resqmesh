version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resqmesh-postgres
    environment:
      POSTGRES_DB: resqmesh_db
      POSTGRES_USER: resqmesh_user
      POSTGRES_PASSWORD: resqmesh_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqmesh_user -d resqmesh_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resqmesh-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resqmesh_db
      SPRING_DATASOURCE_USERNAME: resqmesh_user
      SPRING_DATASOURCE_PASSWORD: resqmesh_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resqmesh-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
